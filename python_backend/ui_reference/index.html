<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>EliteInteliA Intelligence Factory</title>
    <script>
      (function(){
        var KEY='eliteintelia-theme';
        var stored=localStorage.getItem(KEY)||'system';
        function resolved(v){return v==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):v;}
        function apply(v){
          var r=resolved(v);
          document.documentElement.setAttribute('data-ei-theme',r);
          document.documentElement.style.colorScheme=r;
          document.querySelectorAll('#ei-theme-control button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.theme===v?'true':'false');});
          var meta=document.querySelector('meta[name=theme-color]'); if(meta) meta.content=r==='dark'?'#0a1220':'#f5f7fb';
        }
        window.addEventListener('DOMContentLoaded',function(){
          var el=document.createElement('div'); el.id='ei-theme-control'; el.setAttribute('aria-label','Appearance');
          el.innerHTML='<span class="ei-theme-label">Appearance</span><button type="button" data-theme="light" aria-label="Light mode" title="Light mode">☀</button><button type="button" data-theme="system" aria-label="System mode" title="System mode">◐</button><button type="button" data-theme="dark" aria-label="Dark mode" title="Dark mode">☾</button>';
          document.body.appendChild(el);
          el.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){localStorage.setItem(KEY,b.dataset.theme);apply(b.dataset.theme);});});
          apply(stored);
          matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if((localStorage.getItem(KEY)||'system')==='system')apply('system');});
        });
      })();
    </script>
