app:
  name: C INVENT
  version: 0.1.1-poc
  environment: poc
llm:
  base_url: https://api.generative.engine.capgemini.com/v2/llm/invoke
  model_name: openai.gpt-5.1
  provider: azure
  model_interface: langchain
  mode: chain
  auth_header: x-api-key
  auth_scheme: none
  temperature: 0.1
  max_tokens: 1200
  timeout_seconds: 90
image:
  base_url: https://assets.generative.engine.capgemini.com/v1/generate
  model_name: gemini-2.5-flash-image
  provider: vertexai
databricks:
  allow_mutations: false
  default_catalog: main
  default_schema: cinvent
governance:
  require_approval_before_mutation: true
  audit_all_actions: true
